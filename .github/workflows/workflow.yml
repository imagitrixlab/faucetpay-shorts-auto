name: Render FaucetPay Masterpiece Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python libraries
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 opencv-python-headless Pillow numpy gdown

      - name: Run FaucetPay Masterpiece Processor
        run: python video_processor.py

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_faucetpay_shorts
          path: final_faucetpay_shorts.mp4
