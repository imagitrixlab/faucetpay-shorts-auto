name: Render FaucetPay Masterpiece Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg, Fonts & Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core file
          pip install --upgrade gdown "moviepy==1.0.3" "pillow==9.5.0" opencv-python-headless "numpy<2.0"

      - name: Download & Verify Screen Recording from Google Drive
        run: |
          gdown 1BUP1ZmLy-28pLzWaekHo_EQbT6gtsjSN -O screen_record.mp4 || curl -L "https://drive.usercontent.google.com/download?id=1BUP1ZmLy-28pLzWaekHo_EQbT6gtsjSN&export=download&confirm=t" -o screen_record.mp4
          test -s screen_record.mp4
          file -b --mime-type screen_record.mp4 | grep -q "^video/"
          ls -lh screen_record.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 screen_record.mp4

      - name: Generate 30s International Short
        run: python video_processor.py

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-faucetpay-shorts
          path: final_faucetpay_shorts.mp4
